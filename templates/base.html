{% from "_button.html" import lnk with context %}
<!doctype html>
<html lang="id" data-theme="{{ p.theme if p is defined else 'embun' }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <script>
    try {
      document.documentElement.dataset.mode =
        localStorage.getItem("mode") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) { document.documentElement.dataset.mode = "light"; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,400&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)",
            card: "var(--card)",
            foreground: "var(--foreground)",
            accent: "var(--accent)",
            muted: { foreground: "var(--muted-foreground)" },
            border: "var(--border)",
            ring: "var(--ring)",
          },
          borderRadius: { md: "calc(var(--radius) - 2px)" },
          fontFamily: { poem: ["Newsreader", "Georgia", "serif"] },
        }
      },
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>

<body class="min-h-screen bg-background text-foreground antialiased font-sans">
  <!-- Mode terang/gelap -->
  <button id="mode" type="button" class="{{ lnk }} fixed right-6 top-6 clean-hide z-50 p-2"
    aria-label="Ganti mode terang atau gelap">
    <svg id="mode-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <!-- default: moon -->
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>

  <!-- Fullscreen / Focus (pojok kanan bawah) -->
  <button id="clean" type="button" class="{{ lnk }} fixed right-6 bottom-6 z-50 p-2" aria-label="Mode fokus"
    title="Mode fokus">

    <svg id="clean-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <!-- expand -->
      <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
    </svg>
  </button>
  <main class="flex min-h-screen items-center justify-center px-6 py-20">
    <div class="w-full max-w-lg">
      {% block content %}{% endblock %}
    </div>
  </main>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
