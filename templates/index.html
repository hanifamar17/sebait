{% extends "base.html" %}
{% from "_button.html" import btn, lnk with context %}
{% block content %}
<div class="clean-hide mb-16 flex items-center justify-between">
  {% set current = p.theme %}{% include "_palet.html" %}
  <div class="relative -mr-2.5">
    <button id="more" type="button" class="icon-btn" aria-expanded="false" aria-haspopup="true" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="1.6" />
        <circle cx="12" cy="12" r="1.6" />
        <circle cx="12" cy="19" r="1.6" />
      </svg>
    </button>
    <div id="more-menu"
      class="absolute right-0 top-full z-20 mt-2 hidden min-w-[8rem] rounded-md border border-border bg-card py-1 shadow-sm">
      <button id="copy" type="button" class="menu-item">
        <svg class="menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <span class="menu-label">Salin</span>
      </button>
      <a id="story-link" href="{{ p.story }}" class="menu-item">
        <svg class="menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="3" width="12" height="18" rx="2" />
          <line x1="10" y1="7" x2="14" y2="7" />
        </svg>
        <span class="menu-label">Story</span>
      </a>
    </div>
  </div>
</div>
<!-- TENGAH: puisi -->
{% include "_poem.html" %}
<!-- BAWAH: kiri Lain+Tulis, kanan Simpan -->
<div class="clean-hide mt-16 flex items-center justify-between border-t border-border pt-2">
  <div class="-ml-2.5 flex items-center gap-1">
    <button id="again" type="button" class="action-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8" />
        <line x1="4" y1="20" x2="21" y2="3" />
        <polyline points="21 16 21 21 16 21" />
        <line x1="15" y1="15" x2="21" y2="21" />
        <line x1="4" y1="4" x2="9" y2="9" />
      </svg>
      <span>Lain</span>
    </button>
    <a id="edit-link" href="{{ p.edit }}" class="action-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
      </svg>
      <span id="edit-label">{{ "Sunting" if p.token else "Tulis" }}</span>
    </a>
  </div>
  <div class="-mr-2.5">
    <button id="save" type="button" class="icon-btn" aria-pressed="false" aria-label="Simpan" title="Simpan" {% if
      p.token %} hidden{% endif %}>
      <svg class="icon-outline" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
      </svg>
      <svg class="icon-filled hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
      </svg>
    </button>
  </div>
</div>
<script type="application/json" id="data">{{ p|tojson }}</script>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='palet.js') }}"></script>
<style>
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    color: var(--muted-foreground);
    transition: color .15s, background .15s, transform .1s;
  }
  .icon-btn[hidden] {
    display: none;
  }
  .icon-btn:hover {
    color: var(--foreground);
    background: color-mix(in srgb, var(--foreground) 6%, transparent);
  }
  .icon-btn:active {
    transform: scale(0.92);
  }
  .icon-btn[aria-pressed="true"] {
    color: var(--accent);
  }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    height: 40px;
    padding: 0 0.8rem 0 0.65rem;
    border-radius: 8px;
    font-size: 0.875rem;
    color: var(--muted-foreground);
    transition: color .15s, background .15s, transform .1s;
  }
  .action-btn:hover {
    color: var(--foreground);
    background: color-mix(in srgb, var(--foreground) 6%, transparent);
  }
  .action-btn:active {
    transform: scale(0.97);
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    width: 100%;
    padding: 0.5rem 0.85rem;
    font-size: 0.875rem;
    text-align: left;
    color: var(--foreground);
  }
  .menu-item:hover {
    background: color-mix(in srgb, var(--foreground) 6%, transparent);
  }
  .menu-icon {
    flex-shrink: 0;
    opacity: 0.75;
  }
</style>
<script>
  const poem = document.getElementById("poem");
  const source = document.getElementById("source");
  const link = document.getElementById("story-link");
  const btn = document.getElementById("again");
  const save = document.getElementById("save");
  const copy = document.getElementById("copy");
  const more = document.getElementById("more");
  const menu = document.getElementById("more-menu");
  const editLink = document.getElementById("edit-link");
  const editLabel = document.getElementById("edit-label");
  const iconOutline = save.querySelector(".icon-outline");
  const iconFilled = save.querySelector(".icon-filled");
  let cur = JSON.parse(document.getElementById("data").textContent);
  const plain = l => l.replaceAll("_", "");
  const keyOf = p => p.token ? "t:" + p.token : "s:" + p.seed;
  const urlOf = p => p.token ? "/?t=" + p.token : "/?s=" + p.seed;
  const editOf = p => p.edit || (p.token ? "/tulis?t=" + p.token : "/tulis");
  const lineClass = i => i === 0 ? "font-semibold tracking-tight" : "mt-2 italic text-accent";
  function syncSave() {
    save.hidden = !!cur.token;
    const on = Fav.has(keyOf(cur));
    save.setAttribute("aria-pressed", on);
    iconOutline.classList.toggle("hidden", on);
    iconFilled.classList.toggle("hidden", !on);
  }
  function syncEdit() {
    editLink.href = editOf(cur);
    editLabel.textContent = cur.token ? "Sunting" : "Tulis";
  }
  async function again() {
    if (btn.disabled) return;
    btn.disabled = true;
    poem.dataset.loading = "true";
    try {
      const [res] = await Promise.all([
        fetch("/api/puisi"),
        new Promise(r => setTimeout(r, 350))
      ]);
      if (!res.ok) throw new Error(res.status);
      cur = await res.json();
      poem.replaceChildren(...cur.lines.map((t, i) => {
        const el = document.createElement("p");
        el.className = lineClass(i);
        el.textContent = t;
        return el;
      }));
      source.textContent = cur.source;
      link.href = "/puisi/" + cur.seed;
      document.documentElement.dataset.theme = cur.theme;
      window.dispatchEvent(new Event("themechange"));
      history.replaceState(null, "", urlOf(cur));
      syncSave();
      syncEdit();
    } catch (e) {
      poem.textContent = "Gagal memuat. Coba lagi.";
    } finally {
      poem.dataset.loading = "false";
      btn.disabled = false;
    }
  }
  function closeMenu() {
    menu.classList.add("hidden");
    more.setAttribute("aria-expanded", "false");
  }
  more.addEventListener("click", e => {
    e.stopPropagation();
    const open = menu.classList.contains("hidden");
    menu.classList.toggle("hidden", !open);
    more.setAttribute("aria-expanded", open);
  });
  document.addEventListener("click", closeMenu);
  menu.addEventListener("click", e => e.stopPropagation());
  btn.addEventListener("click", again);
  save.addEventListener("click", () => {
    Fav.toggle({
      key: keyOf(cur),
      url: urlOf(cur),
      lines: cur.lines.map(plain),
      source: cur.source,
      theme: cur.theme
    });
    syncSave();
  });
  syncSave();
  syncEdit();
  copy.addEventListener("click", async () => {
    const text = [
      ...cur.lines.map(plain),
      ...(cur.source ? ["— " + cur.source] : []),
      location.origin + urlOf(cur)
    ].join("\n");
    const label = copy.querySelector(".menu-label");
    const original = label.textContent;
    try {
      await navigator.clipboard.writeText(text);
      label.textContent = "Disalin";
    } catch {
      label.textContent = "Gagal";
    }
    setTimeout(() => {
      label.textContent = original;
      closeMenu();
    }, 1100);
  });
  const focusMode = () =>
    btn.checkVisibility
      ? !btn.checkVisibility({ checkOpacity: true, checkVisibilityCSS: true })
      : false;
  const interactive = t =>
    t.closest("button, a, input, textarea, select, [contenteditable]");
  document.addEventListener("keydown", e => {
    if ((e.key !== " " && e.key !== "ArrowRight") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (interactive(e.target) || focusMode()) return;
    e.preventDefault();
    again();
  });
  let sx = 0, sy = 0, ok = false;
  document.addEventListener("touchstart", e => {
    ok = !interactive(e.target);
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!ok || focusMode()) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (dx < -70 && Math.abs(dy) < 50) again();
  }, { passive: true });
</script>
{% endblock %}
