{% extends "base.html" %}
{% from "_button.html" import btn, lnk with context %}
{% block title %}Tersimpan · {{ SITE_NAME }}{% endblock %}
{% block content %}
<header class="flex items-center gap-4 py-3">
    <a href="{{ url_for('index') }}"
        class="inline-flex size-10 items-center justify-center rounded-lg text-muted-foreground transition hover:bg-[color-mix(in_srgb,var(--foreground)_6%,transparent)] hover:text-foreground active:scale-90"
        aria-label="Kembali" title="Kembali"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5" />
            <path d="M12 19l-7-7 7-7" />
        </svg></a>
    <p id="count" class="text-sm text-muted-foreground"></p>
</header>

<ul id="list" class="mt-2 divide-y divide-border"></ul>
<p id="kosong" class="mt-16 hidden text-center font-poem text-[15px] italic text-muted-foreground">Belum ada yang
    disimpan.</p>
{% endblock %}

{% block scripts %}
<script>
    const list = document.getElementById("list");
    const empty = document.getElementById("kosong");
    const count = document.getElementById("count");
    const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text ?? "" });

    function render() {
        const items = Fav.list();
        empty.classList.toggle("hidden", items.length > 0);
        count.textContent = items.length ? items.length + " tersimpan" : "";

        list.replaceChildren(...items.map(f => {
            const li = el("li", "group transition-all duration-200 hover:bg-[color-mix(in_srgb,var(--foreground)_4%,transparent)] motion-reduce:transition-none");
            const row = el("div", "flex items-start gap-3 px-2 py-5");
            const a = el("a", "min-w-0 flex-1 font-poem");

            // URL dari key (s:123 / t:abc) — lebih konsisten daripada f.url
            if (f.key.startsWith("s:")) {
                a.href = "/?s=" + encodeURIComponent(f.key.slice(2));
            } else if (f.key.startsWith("t:")) {
                a.href = "/?t=" + encodeURIComponent(f.key.slice(2));
            } else {
                a.href = f.url || "/";
            }

            a.append(el("p", "text-[18px] leading-snug text-foreground", f.lines[0]));

            if (f.lines.length > 1) {
                a.append(el("p", "mt-1.5 line-clamp-2 text-[14px] italic leading-snug text-muted-foreground",
                    f.lines.slice(1).join(" · ")));
            }

            if (f.source) {
                a.append(el("p", "mt-3 text-[13px] text-muted-foreground/80", f.source));
            }

            const del = el("button", "-mr-1 shrink-0 rounded-full p-2 text-accent opacity-60 transition hover:bg-[color-mix(in_srgb,var(--accent)_12%,transparent)] hover:opacity-100 focus-visible:opacity-100 group-hover:opacity-100 active:scale-90");
            del.type = "button";
            del.setAttribute("aria-label", "Hapus dari tersimpan");
            del.title = "Hapus dari tersimpan";
            del.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
            del.addEventListener("click", e => {
                e.preventDefault();
                e.stopPropagation();
                li.classList.add("opacity-0", "translate-x-2");
                setTimeout(() => Fav.remove(f.key), 200);
            });

            row.append(a, del);
            li.append(row);
            return li;
        }));
    }

    document.addEventListener("favchange", render);
    render();
</script>
{% endblock %}
