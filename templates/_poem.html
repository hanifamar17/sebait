{# baris pertama: roman tebal, warna teks. baris kedua: italic, warna aksen. #}
<div id="poem" class="poem font-poem text-3xl leading-[1.3] sm:text-4xl" data-loading="false" aria-live="polite">
  {% for l in p.lines %}<p class="{% if loop.first %}font-semibold tracking-tight{% else %}mt-2 italic text-accent{% endif %}">{{ l }}</p>{% endfor %}
</div>
<p id="source" class="mt-8 text-sm text-muted-foreground">{{ p.source }}</p>
